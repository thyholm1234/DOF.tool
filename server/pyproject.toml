[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dof-portal"
version = "1.0.0"
description = "Portal for feltornitologer: live-observationer, lister, notifikationer, fænologi og læring."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "redis>=5.2",
  "pydantic-settings>=2.6",
  "httpx>=0.28",
  "argon2-cffi>=23.1",
  "pywebpush>=2.0",
  "py-vapid>=1.9",
  "numpy>=2.1",
  "python-multipart>=0.0.18",
  "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
include = ["portal*"]

[tool.setuptools.package-data]
portal = ["seed/*", "seed/*/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
