[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dof-tool"
version = "0.1.0"
description = "Unified DOF platform with FastAPI backend and PWA frontend."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "redis>=6.4.0",
  "sqlalchemy>=2.0.43",
  "asyncpg>=0.30.0",
  "pydantic-settings>=2.10.1",
  "httpx>=0.28.1",
  "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

