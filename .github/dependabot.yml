# Opdateringsforslag som pull requests. Python-afhængighederne (server/constraints.txt) dækkes af pip-audit i
# .github/workflows/sikkerhed.yml – Dependabot læser ikke constraints-filer.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /server
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /dbadmin
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
